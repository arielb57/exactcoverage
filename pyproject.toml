[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "exactcoverage"
version = "0.1.0"
description = "VaR backtests (Kupiec, Christoffersen, Basel traffic light) with exact finite-sample p-values"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ariel Belhamou" }]
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
test = ["pytest>=7", "hypothesis>=6"]
lint = ["ruff==0.6.9"]

[project.scripts]
exactcoverage = "exactcoverage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035"]
